aid: dflow
name: DFlow
description: >-
  DFlow is a trading protocol and aggregator for spot trading natively on Solana, offering a
  Trading API that powers tens of billions of dollars in transacted value for traders, applications,
  and financial institutions. It provides imperative and declarative (intent-based) swaps, JIT
  routing across liquidity venues, MEV / sandwich protection, priority-fee and slippage controls,
  builder platform-fee monetization (platformFeeBps), sponsored (gasless) swaps, WebSocket
  market-data streams (quotes, order-book depth, priority fees), and prediction-market
  initialization. DFlow is agent-native: a single-binary agent CLI with an encrypted local wallet,
  published Claude Code Skills, and a hosted documentation MCP server. Authentication is via an
  x-api-key header; REST responses can be cryptographically signed with ed25519 per RFC 9421.
  Backed by Multicoin Capital.
