  - openapi/dflow-openapi-original.json#order_status_handler
  - openapi/dflow-openapi-original.json#prediction_market_init_handler
  codes:
  - code: route_not_found
    meaning: No viable route between inputMint and outputMint.
    remediation: >-
      Most often caused by passing human-readable instead of atomic `amount`
      units, or an illiquid pair / trade size beyond available liquidity. Use
      atomic units, try a smaller amount or a different pair.
  - code: price_impact_too_high
    meaning: Effective routing price is worse than the allowed threshold.
    remediation: Set your own threshold via priceImpactTolerancePct.
  - code: requested_input_amount_is_zero
  - code: invalid_input_mint
  - code: invalid_output_mint
