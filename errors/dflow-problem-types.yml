format: json
notes: >-
  The DFlow Trading API returns errors as application/json (not RFC 9457
  problem+json). Each error response carries a machine-readable string `code`
  drawn from a per-endpoint enum plus an HTTP status. Codes below are the
  verbatim enum values from the OpenAPI error schemas; the general HTTP 429
  rate-limit and the two most common trading errors are enriched from the
  published error-codes reference.
envelope:
  fields:
  - code        # machine-readable string, e.g. route_not_found
  status_source: HTTP status code
general_http:
- status: 429
  title: Rate limit exceeded
  when: Too many requests in a short window on the rate-limited developer endpoints.
  remediation: Retry with backoff, reduce request rate, or use a production API key.
problems:
- status: 400
  title: Bad request
  source_operations:
  - openapi/dflow-openapi-original.json#quote_handler
  - openapi/dflow-openapi-original.json#order_handler
  - openapi/dflow-openapi-original.json#intent_handler
